<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Web 1</title>
</head>
<body>

    <h1>Color Moderno</h1>

    <label>
        Color de la página:
        <input type="color" id="colorPagina">
    </label>

    <script>
        const selector = document.getElementById("colorPagina");

        selector.addEventListener("input", function() {
            document.body.style.backgroundColor = selector.value;
        });
    </script>

</body>
</html>
